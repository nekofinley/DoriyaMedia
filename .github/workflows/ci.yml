name: CI

# 注意：这里用的 action 跑在 Node 24 上，要求 runner >= v2.327.1。
# GitHub 托管的 ubuntu-latest 已满足；自建 runner 需要先升级。

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'testdata/**'
      - '.uitest/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Protocol contract
        shell: pwsh
        run: ./scripts/check-protocol.ps1

      # 编译目标平台，确保发布用的交叉编译路径不会挂
      - name: Build (linux/amd64)
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -o /tmp/doriyamedia ./cmd/doriyamedia
