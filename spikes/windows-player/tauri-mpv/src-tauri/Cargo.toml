[package]
name = "doriya-w0-tauri-mpv"
version = "0.1.0"
description = "Isolated Windows W0 spike for Tauri 2 and an mpv JSON IPC sidecar"
authors = ["Doriya"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "doriya_w0_tauri_mpv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.2.0", features = [] }

[dependencies]
getrandom = "0.2.17"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "=2.5.1", features = [] }
# Keep the Tauri 2.5.x family aligned on Rust 1.87-compatible releases.
# The lockfile is the authoritative resolution; these pins prevent semver drift.
tauri-macros = "=2.2.0"
tauri-runtime = "=2.6.0"
tauri-runtime-wry = "=2.6.0"
tauri-utils = "=2.4.0"
url = "2.5.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Pipes"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
